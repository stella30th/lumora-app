spring.application.name=Lumora

# --- Ket noi Postgres (container docker-compose) ---
spring.datasource.url=jdbc:postgresql://localhost:5434/lumora
spring.datasource.username=lumora
spring.datasource.password=lumora

# --- Hibernate/JPA ---
# update: tu dong tao/sua bang theo Entity khi chay (chi dung cho dev, KHONG dung o production)
spring.jpa.hibernate.ddl-auto=update
# In ra console cau SQL Hibernate sinh ra, giup debug va hoc cach JPA map Entity -> SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT (access token) ---
# Secret ky JWT - toi thieu 32 ky tu (HS256 can khoa >= 256 bit).
# Cach lam chuan: KHONG hardcode secret that trong file commit len git, chi de default cho dev local.
# Khi deploy that (Vercel/env khac) se ghi de bang bien moi truong JWT_SECRET, khong sua file nay.
jwt.secret=${JWT_SECRET:lumora-day6-jwt-dev-secret-toi-thieu-32-ky-tu-khong-dung-o-production}
# Ngay 15: rut tu 86400000 (24 gio) xuong 900000 (15 phut). Truoc Ngay 15, token song 24h la
# CHAP NHAN DUOC vi chua co cach nao "xin lai" token moi khi het han ngoai viec dang nhap lai
# tu dau - rut ngan luc do chi lam phien nguoi dung. Gio da co /api/users/refresh, token song
# NGAN lai moi thuc su co y nghia bao mat (gioi han thoi gian huu dung neu access token bi lo -
# xem docs/recap-day15.md). Muon test tay lau hon ma khong bi het han giua chung, tang tam
# thoi vao file local (KHONG commit), vd 3600000 (1 gio).
jwt.expiration-ms=900000

# --- Refresh token (Ngay 15) ---
# 604800000 ms = 7 ngay - song LAU HON access token rat nhieu vi it rui ro hon: chi di qua
# mang dung 2 thoi diem (luc login, luc goi /refresh), khong bay theo MOI request nhu access
# token nen it co hoi bi lo hon.
jwt.refresh-expiration-ms=604800000
