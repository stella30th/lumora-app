spring.application.name=Lumora

# --- Ket noi Postgres (container docker-compose) ---
spring.datasource.url=jdbc:postgresql://localhost:5434/lumora
spring.datasource.username=lumora
spring.datasource.password=lumora

# --- Hibernate/JPA ---
# update: tu dong tao/sua bang theo Entity khi chay (chi dung cho dev, KHONG dung o production)
spring.jpa.hibernate.ddl-auto=update
# In ra console cau SQL Hibernate sinh ra, giup debug va hoc cach JPA map Entity -> SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Secret ky JWT - toi thieu 32 ky tu (HS256 can khoa >= 256 bit).
# Cach lam chuan: KHONG hardcode secret that trong file commit len git, chi de default cho dev local.
# Khi deploy that (Vercel/env khac) se ghi de bang bien moi truong JWT_SECRET, khong sua file nay.
jwt.secret=${JWT_SECRET:lumora-day6-jwt-dev-secret-toi-thieu-32-ky-tu-khong-dung-o-production}
# Thoi gian song cua token: 86400000 ms = 24 gio
jwt.expiration-ms=86400000
