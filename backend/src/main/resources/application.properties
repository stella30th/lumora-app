spring.application.name=Lumora

spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.data.web.pageable.max-page-size=100

springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=900000

jwt.refresh-expiration-ms=604800000

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

review.new-cards-per-day=${REVIEW_NEW_CARDS_PER_DAY:20}

auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}

auth.rate-limit.login-per-minute=${RATE_LIMIT_LOGIN_PER_MINUTE:10}
auth.rate-limit.register-per-minute=${RATE_LIMIT_REGISTER_PER_MINUTE:5}
auth.rate-limit.refresh-per-minute=${RATE_LIMIT_REFRESH_PER_MINUTE:60}
auth.rate-limit.email-per-minute=${RATE_LIMIT_EMAIL_PER_MINUTE:3}
auth.rate-limit.verify-per-minute=${RATE_LIMIT_VERIFY_PER_MINUTE:20}

app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.mail.from=${MAIL_FROM:no-reply@lumora.local}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
